# Render Blueprint 配置文件
# Word Helper 项目 - 后端 API 服务
# 数据库使用 Neon PostgreSQL（永久免费）

services:
  - type: web
    name: word-helper-api
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # 数据库连接 - 使用 Neon PostgreSQL
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require