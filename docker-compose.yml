version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: word-helper-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wordhelper
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wordhelper"]
      interval: 5s
      timeout: 5s
      retries: 5

  word-helper:
    build: .
    container_name: word-helper
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
      - .env.production
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/wordhelper
      PGSSLMODE: disable
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: