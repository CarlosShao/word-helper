# Render Blueprint 配置文件
# 用途：定义 Word Helper 项目的基础设施配置

# 可选的预览环境配置
previews:
  generation: automatic  # 自动为每个 PR 创建预览环境

# 服务定义列表
services:
  # 后端 API 服务
  - type: web                    # Web 服务类型
    name: word-helper-api        # 服务名称
    env: node                    # Node.js 环境
    region: singapore            # 区域：亚太地区（新加坡），访问速度快
    plan: free                   # 免费计划
    rootDir: backend              # 后端代码在 backend 子目录
    
    # 构建配置
    buildCommand: npm install && npm run build
    
    # 启动命令
    startCommand: npm start
    
    # 自动部署
    autoDeploy: true
    
    # 健康检查
    healthCheckPath: /health
    
    # 环境变量
    envVars:
      # Node 环境
      - key: NODE_ENV
        value: production
      
      # 端口（Render 会自动设置，但为了明确性保留）
      - key: PORT
        value: 10000
      
      # 数据库连接（从 Render PostgreSQL 自动注入）
      - key: DATABASE_URL
        fromDatabase:
          name: word-helper-db
          property: connectionString
      
      # 数据库 SSL 配置（Render PostgreSQL 需要）
      - key: PGSSLMODE
        value: require

# 数据库定义
databases:
  - name: word-helper-db          # 数据库名称
    plan: free                    # 免费计划（注意：90天后过期）
    region: singapore              # 与服务同一区域，连接更快
    databaseName: wordhelper       # 数据库名
    ipAllowList: []                # 允许所有 IP 访问