version: '3.8'

services:
  word-helper:
    build: .
    container_name: word-helper
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      # 数据库连接字符串（默认使用后端内置的远程数据库）
      # 如需更换，可以修改下面的 DATABASE_URL
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped
